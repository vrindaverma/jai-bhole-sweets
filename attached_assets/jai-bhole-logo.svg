  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8E281E"/><stop offset="1" stop-color="#50100D"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE6A0"/><stop offset=".48" stop-color="#E5AD36"/><stop offset="1" stop-color="#A95D08"/></linearGradient>
  </defs>
  <g transform="translate(18 13)">
    <circle cx="112" cy="112" r="104" fill="#FFF9EA" stroke="#6C1712" stroke-width="7"/>
    <circle cx="112" cy="112" r="91" fill="url(#wine)" stroke="url(#gold)" stroke-width="3"/>
    <path d="M112 37v46m0-45c-12 14-24 9-29-6 0 22 10 33 29 33m0-27c12 14 24 9 29-6 0 22-10 33-29 33" fill="none" stroke="#F7D77B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
