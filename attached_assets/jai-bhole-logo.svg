    <text x="3" y="112" fill="#B66B0B" font-family="Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="13">SWEETS</text>
    <path d="M4 132h438" stroke="#D9A333" stroke-width="3"/>
    <text x="5" y="164" fill="#651713" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">SINCE 1998</text>
    <text x="5" y="199" fill="#79574A" font-family="Georgia,Times New Roman,serif" font-size="18" font-style="italic">Bisauli ki mithaas, dil se.</text>
